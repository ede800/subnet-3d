name: Update SubNet data

on:
  schedule:
    - cron: '0 3 * * *' # tous les jours à 03h00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subnet-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch TeleGeography + RIPEstat + IODA
        run: python scripts/update_cables_and_outages.py

      - name: Validate dataset
        run: |
          python - <<'PY'
          import json
          d = json.load(open("public/data/subnet_data.json", encoding="utf-8"))
          assert len(d["cables"]) >= 20, "trop peu de câbles"
          assert len(d["edges"]) > 100, "graphe incomplet"
          assert len(d["chokepoints"]) == 6
          print("OK", d["meta"]["counts"], d["meta"]["sources"])
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: mise à jour quotidienne $(date -u +%Y-%m-%d)"
            git push
          fi
